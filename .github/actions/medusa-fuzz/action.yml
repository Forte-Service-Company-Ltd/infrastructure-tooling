name: On-chain Medusa Fuzz
description: Runs forge build and medusa fuzzing for on-chain microservices.
# Troubleshooting:
# 1. Ensure medusa.json exists and targetContracts are correctly specified
# 2. Verify test contracts have property_ or optimize_ prefixed functions
# 3. Check that contracts compile successfully with forge/crytic-compile
# 4. Enable assertion testing if using assert() statements
inputs:
  config:
    description: "Path to medusa configuration file"
    required: false
    default: "medusa.json"
  timeout:
    description: "Timeout for fuzzing in seconds"
    required: false
    default: "1800" # Default to 30 minutes
runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    - name: Go setup
      uses: actions/setup-go@v4
      with:
        go-version: "^1.18.1"

    - name: Install Python dependencies
      id: install-python-deps
      shell: bash
      run: |
        pip install crytic-compile slither-analyzer

    - name: Clone Medusa
      id: medusa-source
      shell: bash
      run: |
        git clone https://github.com/crytic/medusa.git
        echo "sha=$(git -C medusa rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Restore Medusa binary
      id: medusa-cache
      uses: actions/cache/restore@v4
      with:
        path: medusa/medusa
        key: medusa-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.medusa-source.outputs.sha }}

    - name: Build Medusa
      if: steps.medusa-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd medusa
        go build -o medusa -v .

    - name: Save Medusa binary
      if: steps.medusa-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: medusa/medusa
        key: ${{ steps.medusa-cache.outputs.cache-primary-key }}

    - name: Install Medusa
      id: install-medusa
      shell: bash
      run: sudo cp medusa/medusa /usr/bin

    - name: Verify installations
      id: verify-installs
      shell: bash
      run: |
        echo "Checking medusa installation..."
        medusa --version
        echo "Checking slither installation..."
        slither --version
        echo "Checking crytic-compile installation..."
        crytic-compile --version

    - name: Run Medusa tests
      id: medusa-test
      shell: bash
      run: |
        CONFIG_FILE="${{ inputs.config }}"
        if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Configuration file $CONFIG_FILE not found"
            echo "Available files in current directory:"
            ls -la
            exit 1
        fi
        jq '.fuzzing.coverageFormats = [] | .fuzzing.revertReporterEnabled = false' \
          "$CONFIG_FILE" > "${CONFIG_FILE}.tmp"
        mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"

        echo "Starting Medusa fuzzing with config: $CONFIG_FILE"
        echo "Working directory: $(pwd)"
        echo "Medusa version: $(medusa --version)"

        # Run with timeout
        timeout ${{ inputs.timeout }} medusa fuzz --config "$CONFIG_FILE" || {
            exit_code=$?
            if [ $exit_code -eq 124 ]; then
                echo "::error title=Medusa timeout::Medusa fuzzing was killed after ${{ inputs.timeout }} seconds before completing;"
                exit 1
            else
                echo "Medusa fuzzing failed with exit code: $exit_code"
                exit $exit_code
            fi
        }

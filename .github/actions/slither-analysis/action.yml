name: On-chain Slither Analysis
description: Runs forge build and slither analysis for on-chain microservices.
inputs:
  config:
    description: Path to slither config file
    required: false
    default: ./slither.config.json
  target:
    description: Target directory or file for slither analysis
    required: false
    default: .
  slither-version:
    description: Version of slither-analyzer to install
    required: false
    default: 0.11.6
runs:
  using: "composite"
  steps:
    - name: Slither Analyze
      id: slither
      shell: bash
      env:
        SLITHER_CONFIG: ${{ inputs.config }}
        SLITHER_TARGET: ${{ inputs.target }}
        SLITHER_VERSION: ${{ inputs.slither-version }}
      run: |
        python -m pip install "slither-analyzer==${SLITHER_VERSION}"
        echo "Running slither analysis..."
        echo "Target: ${SLITHER_TARGET}"
        echo "Config: ${SLITHER_CONFIG}"

        # Try to run slither with error handling
        set +e  # Don't exit on error
        slither "${SLITHER_TARGET}" \
          --config-file "${SLITHER_CONFIG}" \
          --sarif results.sarif \
          --json results.json \
          --fail-none

    - name: Upload SARIF file
      uses: actions/upload-artifact@v4
      with:
        name: results.sarif
        path: ./results.sarif
        retention-days: 5

    - name: Create/update Slither PR comment
      if: github.event.pull_request != null
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const {
            MARKER,
            extractJsonFindings,
            findExistingComment,
            renderReport,
          } = require(path.join('${{ github.action_path }}', 'slither-comment.js'));

          const jsonPath = './results.json';
          let comment;
          try {
            const findings = extractJsonFindings(JSON.parse(fs.readFileSync(jsonPath, 'utf8')));
            const repositoryUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repositoryUrl}/actions/runs/${context.runId}`;
            comment = renderReport({
              findings,
              repositoryUrl,
              headSha: context.payload.pull_request.head.sha,
              runUrl,
            });
          } catch (error) {
            comment = `${MARKER}\n# 🔍 Slither Analysis Report\n\n❌ Error reading Slither results: ${error.message}`;
          }

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            per_page: 100,
          });
          const botComment = findExistingComment(comments);
          const commentFn = botComment ? "updateComment" : "createComment";
          await github.rest.issues[commentFn]({
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment,
            ...(botComment
              ? { comment_id: botComment.id }
              : { issue_number: context.payload.pull_request.number }),
          });

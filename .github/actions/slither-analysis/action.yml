name: On-chain Slither Analysis
description: Runs Slither analysis and uploads SARIF results to GitHub code scanning.
inputs:
  config:
    description: Path to slither config file
    required: false
    default: ./slither.config.json
  target:
    description: Target directory or file for slither analysis
    required: false
    default: .
  slither-version:
    description: Version of slither-analyzer to install
    required: false
    default: 0.11.6
  slither-args:
    description: Space-separated arguments passed to Slither
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Slither Analyze
      id: slither
      shell: bash
      env:
        SLITHER_CONFIG: ${{ inputs.config }}
        SLITHER_TARGET: ${{ inputs.target }}
        SLITHER_VERSION: ${{ inputs.slither-version }}
        SLITHER_ARGS: ${{ inputs.slither-args }}
      run: |
        python -m pip install "slither-analyzer==${SLITHER_VERSION}"
        echo "Running slither analysis..."
        echo "Target: ${SLITHER_TARGET}"
        echo "Config: ${SLITHER_CONFIG}"

        read -r -a args <<< "$SLITHER_ARGS"

        slither "${SLITHER_TARGET}" \
          "${args[@]}" \
          --config-file "${SLITHER_CONFIG}" \
          --sarif results.sarif \
          --fail-none

    - name: Upload SARIF artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: results.sarif
        path: ./results.sarif
        retention-days: 5

    - name: Upload SARIF to code scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: results.sarif

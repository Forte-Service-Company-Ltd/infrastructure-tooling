# GitOps On-chain Build Test and Report Workflow - Callable from remote repositories
# Builds and tests for on-chain projects.
# This workflow is designed to be called from other repositories via 'workflow_call' event.

name: On-Chain Build and Test

# Least privilege: the default GitHub token must not get write scopes.
# Callers inherit/cap at these permissions per GitHub's reusable workflow rules.
permissions:
  contents: read

on:
  # Triggered from app repo's workflows
  workflow_call:
    inputs:
      # Define any inputs needed from the calling workflow
      gh-app-id:
        description: GitHub App ID for generating tokens
        type: string
        required: false
        default: ""
      project-repositories:
        description: Comma-separated list of project repositories to run the workflow on
        type: string
        required: false
        default: ""
      markdown-file-path:
        description: Comma-separated list of markdown files to check
        type: string
        required: false
        default: "./README.md, ./CHANGELOG.md, ./CODE_OF_CONDUCT.md, ./CONTRIBUTING.md, ./SECURITY.md"
      code-coverage:
        description: Whether to run code coverage report (true/false)
        type: boolean
        required: false
        default: true
      code-coverage-args:
        description: Arguments for code coverage report action
        type: string
        required: false
        default: '--ffi --report lcov --no-match-path "*invariant*" --fuzz-runs 1'
      fork-test:
        description: Whether to run tests that require forking mainnet (true/false)
        type: boolean
        required: false
        default: false
      salt-string:
        description: Salt string for generating unique addresses in tests
        type: string
        required: false
        default: "SMELLING_SALTS"
      skip-forte-token-tests:
        description: Whether to skip tests related to Forte Token (true/false)
        type: boolean
        required: false
        default: true
      is-forte-token-project:
        description: Whether this is the Forte Token project (enables Forte-specific env vars)
        type: boolean
        required: false
        default: false

    outputs:
      status:
        description: The overall status of the workflow, either 'success', 'failure'.
        value: ${{ jobs.status.outputs.status }}

    secrets:
      GH_APP_PRIVATE_KEY:
        required: false
        description: Private key for the optional GitHub App authentication
      # Secrets are passed from the calling repository
      ALCHEMY_KEY: # optional, only if needed for tests requiring mainnet fork
        required: false
        description: Alchemy API URI for Ethereum mainnet (for tests requiring mainnet fork)
      POLYGON_ALCHEMY_KEY: # optional, only if needed for tests requiring polygon fork
        required: false
        description: Alchemy API URI for Polygon mainnet (for tests requiring polygon fork)

jobs:
  setup:
    name: Setup
    runs-on: Linux-Arm64
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Generate GitHub App token
        id: get-token
        if: inputs.gh-app-id != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with: # The app-id needs to be set and private-key should be configured in the calling repository's secrets to access private repos.
          app-id: ${{ inputs.gh-app-id }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.project-repositories }}

      - name: Checkout local repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.get-token.outputs.token || github.token}}
          persist-credentials: false
          submodules: recursive

      - name: Checkout infrastructure-tooling repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Forte-Service-Company-Ltd/infrastructure-tooling
          ref: v1
          path: infrastructure-tooling

      - name: Generate cache key
        id: cache-key
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/generate-gha-cache-key@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1
        with:
          fork-test: ${{ inputs.fork-test }}
          salt-string: ${{ inputs.salt-string }}
          skip-forte-token-tests: ${{ inputs.skip-forte-token-tests }}
          is-forte-token-project: ${{ inputs.is-forte-token-project }}

      - name: Install Foundry
        id: install-foundry
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/install-foundry@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1
        with:
          version: v1.7.1

      - name: Install Python Dependencies
        id: install-python-dependencies
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/python-dependency-installer@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1

      - name: Build
        id: build
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/onchain-build@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1
        with:
          build-args: --optimize

      - name: Locate and cache Foundry binaries
        id: locate-foundry-binaries
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/locate-and-cache-foundry-binaries@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1

      - name: Cache setup state
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .
            infrastructure-tooling
            ~/.foundry
            ~/.npm
            ~/.cache/pip
            ~/.local
            node_modules
            bin
            lib
            include
            share
          key: setup-state-${{ steps.cache-key.outputs.key }}

  markdown-link-check:
    name: Markdown Link Check
    runs-on: Linux-Arm64
    needs: [setup]
    timeout-minutes: 15

    steps:
      - name: Restore setup state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .
            infrastructure-tooling
            ~/.foundry
            ~/.npm
            ~/.cache/pip
            ~/.local
            node_modules
            bin
            lib
            include
            share
          key: setup-state-${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      - name: Markdown Link Check
        id: markdown-link-check
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/markdown-link-checker@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1
        with:
          file-path: ${{ inputs.markdown-file-path }}

  contract-size:
    name: Contract Size
    timeout-minutes: 30
    runs-on: Linux-Arm64
    needs: [setup]

    steps:
      - name: Restore setup state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .
            infrastructure-tooling
            ~/.foundry
            ~/.npm
            ~/.cache/pip
            ~/.local
            node_modules
            bin
            lib
            include
            share
          key: setup-state-${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      - name: Set on-chain build PATH
        id: setup-path
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/set-onchain-build-path@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1

      - name: Contract Size
        id: contract-size
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/contract-size@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1

  build-and-test:
    name: Build and Test
    timeout-minutes: 60 # Allow very long running tests
    runs-on: Linux-Arm64
    needs: [setup]
    steps:
      - name: Restore setup state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .
            infrastructure-tooling
            ~/.foundry
            ~/.npm
            ~/.cache/pip
            ~/.local
            node_modules
            bin
            lib
            include
            share
          key: setup-state-${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      - name: Set on-chain build PATH
        id: setup-path
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/set-onchain-build-path@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1

      - name: Test
        id: test
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/onchain-test@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1
        with:
          alchemy_eth_api: ${{ secrets.ALCHEMY_KEY }}
          alchemy_polygon_api: ${{ secrets.POLYGON_ALCHEMY_KEY }}
          fork-test: ${{ inputs.fork-test }}
          salt-string: ${{ inputs.salt-string }}
          skip-forte-token-tests: ${{ inputs.skip-forte-token-tests }}

  code-coverage-report:
    name: Code Coverage
    runs-on: Linux-Arm64
    needs: [setup]
    timeout-minutes: 30
    if: inputs.code-coverage == true
    steps:
      - name: Restore setup state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .
            infrastructure-tooling
            ~/.foundry
            ~/.npm
            ~/.cache/pip
            ~/.local
            node_modules
            bin
            lib
            include
            share
          key: setup-state-${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      - name: Set on-chain build PATH
        id: setup-path
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/set-onchain-build-path@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1

      - name: Code Coverage
        id: code-coverage
        uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/actions/onchain-code-coverage@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1
        with:
          alchemy_eth_api: ${{ secrets.ALCHEMY_KEY }}
          alchemy_polygon_api: ${{ secrets.POLYGON_ALCHEMY_KEY }}
          fork-test: ${{ inputs.fork-test }}
          salt-string: ${{ inputs.salt-string }}
          skip-forte-token-tests: ${{ inputs.skip-forte-token-tests }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          code-coverage-args: ${{ inputs.code-coverage-args }}

  status:
    name: Collect workflow status
    if: always()
    needs: [build-and-test, markdown-link-check, code-coverage-report, contract-size]
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Export status
        id: result
        env:
          WORKFLOW_STATUS: ${{ needs.build-and-test.result == 'success' && needs.markdown-link-check.result == 'success' && needs.contract-size.result == 'success' && (!inputs.code-coverage || needs.code-coverage-report.result == 'success') && 'success' || 'failure' }}
        run: echo "status=$WORKFLOW_STATUS" >> "$GITHUB_OUTPUT"

  notify:
    name: Notify Slack on Pipeline Failure
    needs:
      [build-and-test, markdown-link-check, code-coverage-report, contract-size]
    if: always() && (needs.contract-size.result != 'success' || needs.build-and-test.result != 'success' || needs.markdown-link-check.result != 'success' || (needs.code-coverage-report.result != 'success' && needs.code-coverage-report.result != 'skipped'))

    uses: Forte-Service-Company-Ltd/infrastructure-tooling/.github/workflows/slack-notification.yaml@b8b16be6473c3787dfc4a707d80ce653626f2d74 # v1
    with:
      env: "onchain"
      status: "failure"
      title: "🚨 On-Chain Pipeline Failed: ${{ github.repository }}"
      notify_when: "failure,skipped"
    secrets: inherit
